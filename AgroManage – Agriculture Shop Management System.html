<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AgroManage – Agriculture Shop Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;--bg:#f4f7fa;--card:#fff;--ink:#16202b;--mut:#6a7786;--line:#e3e9ef;--blue:#1d6fd6;--bl:#e8f1fd;--green:#1b9a55;--gl:#e5f6ec;--red:#d34545;--rl:#fdecec;--amb:#c98209;--al:#fff3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",system-ui,Arial,sans-serif}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f1fd,#e5f6ec)}
.lbox{background:#fff;width:400px;max-width:92vw;padding:36px;border-radius:16px;box-shadow:0 20px 50px #1d3b5c1f}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo b{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff}
.logo b svg{width:22px;height:22px}.logo small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--bl);border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:0;border-radius:8px;font:600 13px inherit;cursor:pointer;background:var(--blue);color:#fff}
.btn.g{background:var(--green)}.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:5px 10px;font-size:12px}.btn.w{width:100%;justify-content:center;margin-top:20px;padding:11px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
aside nav{margin-top:22px;flex:1}
.nv{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:#425062;cursor:pointer;font-weight:500;margin-bottom:2px}
.nv:hover{background:var(--bg)}.nv.a{background:var(--bl);color:var(--blue);font-weight:700}
.main{margin-left:230px}
header{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
header .sr{width:320px;background:var(--bg)}
.us{display:flex;align-items:center;gap:10px;font-weight:600}.av{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700}
.pg{padding:26px 28px 40px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.ph h1{margin:0;font-size:22px}.ph p{margin:2px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(6,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}
.k{padding:16px}.k .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px}
.k span{color:var(--mut);font-size:12px}.k b{display:block;font-size:19px;margin-top:2px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px;border-bottom:1px solid var(--line);background:#fafbfd}
td{padding:11px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tr.c{cursor:pointer}tr.c:hover td{background:#f8fafc}
.r{text-align:right}.mut{color:var(--mut)}.tw{overflow-x:auto}
.bd{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.bd.g{background:var(--gl);color:var(--green)}.bd.r{background:var(--rl);color:var(--red)}.bd.a{background:var(--al);color:var(--amb)}.bd.b{background:var(--bl);color:var(--blue)}
.tb{display:flex;gap:10px;margin-bottom:14px}.tb input,.tb select{width:auto;min-width:200px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.pm{display:flex;gap:8px;flex-wrap:wrap}.pm span{padding:8px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}.pm span.a{background:var(--bl);border-color:var(--blue);color:var(--blue)}
.tot div{display:flex;justify-content:space-between;padding:7px 0}.tot .gt{font-size:18px;font-weight:800;border-top:2px solid var(--line);margin-top:6px;padding-top:12px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs span{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:13px}.tabs span.a{background:var(--blue);color:#fff;border-color:var(--blue)}
.mod{position:fixed;inset:0;background:#0f1b2b73;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.mb{background:#fff;border-radius:14px;padding:24px;width:520px;max-width:100%}.mb.l{width:780px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.inv{padding:10px}.inv h2{margin:0;color:var(--green)}.inv .hd{display:flex;justify-content:space-between;border-bottom:3px solid var(--green);padding-bottom:14px;margin-bottom:16px}
.toast{position:fixed;bottom:24px;right:24px;background:#16202b;color:#fff;padding:12px 18px;border-radius:10px;z-index:30}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g2,.g21{grid-template-columns:1fr}}
@media print{aside,header,.nop{display:none!important}.main{margin:0}.mod{position:static;background:none;padding:0}}
</style></head><body>
<div id="login"><div class="lbox"><div class="logo"><b id="lg"></b><div>AgroManage<small>Agriculture Shop Management System</small></div></div>
<h2 style="margin:26px 0 2px">Welcome back</h2><div class="mut">Sign in to manage your shop</div>
<label>Username / Email</label><input value="admin@agromanage.pk"><label>Password</label><input type="password" value="password123">
<button class="btn w" onclick="enter()">Login</button><p class="mut" style="text-align:center;font-size:12px;margin:16px 0 0">Kisan Agro Center · Sahiwal, Punjab</p></div></div>
<div id="app"><aside></aside><div class="main"><header><input class="sr" placeholder="Search customers, products, invoices…"><div class="us"><span class="mut" id="dt"></span><div class="av">AK</div><div>Ahmad Khan<div class="mut" style="font-size:11px;font-weight:500">Shop Owner</div></div></div></header><div class="pg" id="pg"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const IC={dash:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',sales:'M6 6h15l-2 9H8zM6 6L5 3H2M9 20h.01M18 20h.01',purch:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',cust:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',supp:'M1 6h13v10H1zM14 9h4l3 3v4h-7M5 18h.01M17 18h.01',prod:'M12 22V12M12 12C12 7 8 4 3 4c0 5 3 8 9 8M12 12c0-4 3-7 9-7 0 5-3 8-9 8',inv:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h6M9 17h6',inst:'M3 5h18v16H3zM3 10h18M8 2v6M16 2v6',rep:'M4 20V10M10 20V4M16 20v-8M22 20H2',set:'M12 15a3 3 0 100-6 3 3 0 000 6M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4',out:'M9 21H5V3h4M16 17l5-5-5-5M21 12H9',plus:'M12 5v14M5 12h14',pr:'M6 9V2h12v7M6 18H4v-7h16v7h-2M6 14h12v8H6z',dl:'M12 3v12M7 10l5 5 5-5M4 21h16'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
$('lg').innerHTML=ic('prod');
const F=n=>'PKR '+Math.round(n).toLocaleString('en-US');
const TODAY='2026-10-08',fd=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const addD=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
$('dt').textContent=fd(TODAY);
const C=[['Muhammad Aslam','0300-6621845','Chak 45 GB, Faisalabad'],['Rana Tariq Mehmood','0321-4417830','Okara'],['Ch. Imran Ali','0333-7120934','Sahiwal'],['Haji Bashir Ahmad','0345-8812067','Vehari'],['Malik Khalid Hussain','0301-2275519','Multan'],['Sajid Iqbal','0312-9034471','Pakpattan'],['Zafar Iqbal Cheema','0322-5560183','Toba Tek Singh'],['Ghulam Rasool','0307-1148276','Khanewal']].map(a=>({n:a[0],ph:a[1],ad:a[2]}));
const P=[['Pioneer 30T60 Hybrid Maize Seed 10kg','Seeds',11200,12500,48,20,'2027-03-31'],['Akbar-19 Wheat Seed 40kg','Seeds',8600,9200,120,40,'2027-06-30'],['Urea (Sona) 50kg','Fertilizers',4350,4600,210,80,''],['DAP (Engro) 50kg','Fertilizers',11800,12300,36,40,''],['Confidor 200SL 250ml','Pesticides',1450,1700,64,25,'2028-02-28'],['Karate 2.5EC 500ml','Pesticides',2100,2450,18,20,'2027-11-30'],['Touchdown Glyphosate 1L','Herbicides',1650,1950,55,20,'2028-05-31'],['Nativo 75WG 100g','Fungicides',1900,2250,9,15,'2026-12-15'],['Knapsack Sprayer 16L','Tools',3800,4500,14,5,''],['MNH-886 Cotton Seed 5kg','Seeds',4200,4800,72,30,'2027-04-30'],['Topik 15WP 160g','Herbicides',1250,1500,40,15,'2027-08-31']].map(a=>({n:a[0],c:a[1],b:a[2],s:a[3],st:a[4],mn:a[5],ex:a[6]}));
const I=(p,q)=>[p,q,P[p].s];
const V=[{no:'AGR-2026-0142',c:0,d:'2026-10-06',it:[I(3,4),I(2,10)],disc:0,paid:50000,m:'Credit',ins:15000,due:'2026-10-25'},{no:'AGR-2026-0141',c:1,d:'2026-10-05',it:[I(0,2),I(4,3)],disc:500,paid:29600,m:'Cash'},{no:'AGR-2026-0140',c:2,d:'2026-10-03',it:[I(1,10),I(2,20)],disc:2000,paid:100000,m:'Bank',ins:20000,due:'2026-10-01'},{no:'AGR-2026-0139',c:3,d:'2026-09-29',it:[I(8,2),I(5,4),I(6,3)],disc:0,paid:24650,m:'JazzCash'},{no:'AGR-2026-0138',c:4,d:'2026-09-25',it:[I(9,8),I(3,6)],disc:1000,paid:70000,m:'Credit',ins:10000,due:'2026-10-20'},{no:'AGR-2026-0137',c:5,d:'2026-09-20',it:[I(7,6),I(10,4)],disc:0,paid:19500,m:'Easypaisa'},{no:'AGR-2026-0136',c:6,d:'2026-09-12',it:[I(0,6),I(3,10)],disc:3000,paid:95000,m:'Credit',ins:25000,due:'2026-09-30'},{no:'AGR-2026-0135',c:7,d:'2026-09-08',it:[I(2,15),I(6,5)],disc:0,paid:78750,m:'Cash'},{no:'AGR-2026-0134',c:0,d:'2026-08-28',it:[I(1,5),I(4,5)],disc:0,paid:54500,m:'Bank',ins:18000,due:'2026-09-15'}];
const S=['Engro Fertilizers (Dealer)','Syngenta Pakistan – Lahore','Corteva / Pioneer Seeds – Multan','Jaffer Agro Services','Bayer CropScience Pakistan','Agri Tools Traders – Faisalabad'].map((n,i)=>({n,ph:['042-111-436-476','042-35761234','061-4586120','021-111-523-337','042-35712890','041-2630455'][i],ct:['Lahore','Lahore','Multan','Karachi','Lahore','Faisalabad'][i]}));
const U=[{no:'PUR-0087',s:0,d:'2026-10-02',it:[[2,200,4350],[3,60,11800]],paid:1400000},{no:'PUR-0086',s:2,d:'2026-09-27',it:[[0,40,11200],[9,50,4200]],paid:500000},{no:'PUR-0085',s:1,d:'2026-09-20',it:[[4,60,1450],[10,40,1250]],paid:137000},{no:'PUR-0084',s:4,d:'2026-09-14',it:[[5,40,2100],[7,30,1900]],paid:141000},{no:'PUR-0083',s:5,d:'2026-09-05',it:[[8,10,3800]],paid:38000}];
const tot=i=>i.it.reduce((a,x)=>a+x[1]*x[2],0)-(i.disc||0),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const ptot=u=>sum(u.it,x=>x[1]*x[2]);
const stat=p=>p.st<=0?['Out of stock','r']:p.st<p.mn?['Low stock','r']:(p.ex&&p.ex<'2027-01-10'?['Expiring soon','a']:['In stock','g']);
const istat=v=>tot(v)-v.paid<=0?['Paid','g']:v.due<TODAY?['Overdue','r']:['Pending','a'];
const bal=ci=>{let a=V.filter(v=>v.c==ci);return{b:sum(a,tot),p:sum(a,v=>v.paid),n:a.length}};
let page='dashboard',pm='Cash',rep=0,q='',cat='All',lines=[[2,10,4600]];
const NAV=[['dash','Dashboard','dashboard'],['sales','Sales','sales'],['purch','Purchases','purchases'],['cust','Customers','customers'],['supp','Suppliers','suppliers'],['prod','Products & Inventory','products'],['inv','Invoices','invoices'],['inst','Installments','installments'],['rep','Reports','reports'],['set','Settings','settings']];
function enter(){$('login').style.display='none';$('app').style.display='block';go('dashboard')}
function go(p){page=p;q='';cat='All';document.querySelector('aside').innerHTML=`<div class="logo"><b>${ic('prod')}</b><div>AgroManage<small>Kisan Agro Center</small></div></div><nav>${NAV.map(n=>`<div class="nv ${n[2]==p?'a':''}" onclick="go('${n[2]}')">${ic(n[0])}${n[1]}</div>`).join('')}</nav><div class="nv" onclick="location.reload()">${ic('out')}Logout</div>`;draw();scrollTo(0,0)}
const draw=()=>{$('pg').innerHTML=PG[page]();if(page=='sales')calc()};
const hd=(t,s,b='')=>`<div class="ph"><div><h1>${t}</h1><p>${s}</p></div><div style="display:flex;gap:8px">${b}</div></div>`;
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th class="${/PKR|Amount|Total|Paid|Remaining|Balance|Price|Stock|Qty|Billed|Value|Installment$/.test(x)?'r':''}">${x}</th>`).join('')}</tr>${r.join('')}</table></div>`;
const tr=(c,cl,oc='')=>`<tr class="${oc?'c':''}" ${oc?`onclick="${oc}"`:''}>${c.map((x,i)=>`<td class="${cl&&cl[i]||''}">${x}</td>`).join('')}</tr>`;
const bg=(t,c)=>`<span class="bd ${c}">${t}</span>`;
function modal(h,l){let m=document.createElement('div');m.className='mod';m.id='md';m.onclick=e=>{if(e.target==m)m.remove()};m.innerHTML=`<div class="mb ${l?'l':''}">${h}</div>`;document.body.appendChild(m)}
const close=()=>$('md')&&$('md').remove();
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function chart(){const m=['Apr','May','Jun','Jul','Aug','Sep','Oct'],v=[14.2,18.6,12.1,9.8,11.4,21.5,8.9],mx=24;return `<svg viewBox="0 0 560 230" style="width:100%">${[0,8,16,24].map(g=>`<line x1="40" x2="550" y1="${200-g/mx*170}" y2="${200-g/mx*170}" stroke="#e3e9ef"/><text x="30" y="${204-g/mx*170}" font-size="10" fill="#6a7786" text-anchor="end">${g}L</text>`).join('')}${v.map((x,i)=>`<rect x="${58+i*72}" y="${200-x/mx*170}" width="42" height="${x/mx*170}" rx="6" fill="${i==5?'#1b9a55':'#1d6fd6'}"/><text x="${79+i*72}" y="218" font-size="11" fill="#6a7786" text-anchor="middle">${m[i]}</text><text x="${79+i*72}" y="${194-x/mx*170}" font-size="10" fill="#16202b" text-anchor="middle">${x}</text>`).join('')}</svg>`}
const kp=(i,t,v,c,b)=>`<div class="card k"><div class="ic" style="background:var(--${b});color:var(--${c})">${ic(i)}</div><span>${t}</span><b>${v}</b></div>`;
const out=()=>V.filter(v=>v.ins&&tot(v)>v.paid);
const sf=()=>{draw();let e=document.querySelector('.tb input');e.focus();e.setSelectionRange(99,99)};
const PG={
dashboard(){const low=P.filter(p=>p.st<p.mn);return hd('Dashboard','Welcome back, Ahmad — here is how the shop is doing today',`<button class="btn" onclick="go('sales')">${ic('plus')}New Sale</button>`)+
`<div class="grid g6">${kp('sales','Total Sales',F(sum(V,tot)),'blue','bl')}${kp('purch','Total Purchases',F(sum(U,ptot)),'green','gl')}${kp('cust','Total Customers',C.length,'blue','bl')}${kp('prod','Total Products',P.length,'green','gl')}${kp('inst','Outstanding',F(sum(out(),v=>tot(v)-v.paid)),'amb','al')}${kp('prod','Low Stock Items',low.length,'red','rl')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Sales Overview (PKR Lakh)</h3>${chart()}</div><div class="card"><h3>Low-Stock Alerts</h3>${low.map(p=>`<div class="row"><div>${p.n}<div class="mut" style="font-size:12px">Min ${p.mn}</div></div>${bg(p.st+' left','r')}</div>`).join('')}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Recent Sales</h3>${tbl(['Invoice','Customer','Date','Total'],V.slice(0,5).map(v=>tr([v.no,C[v.c].n,fd(v.d),F(tot(v))],['','','','r'],`viewInv('${v.no}')`)))}</div><div class="card"><h3>Pending Payments</h3>${out().slice(0,5).map(v=>`<div class="row"><div>${C[v.c].n}<div class="mut" style="font-size:12px">Due ${fd(v.due)}</div></div><div style="text-align:right"><b>${F(tot(v)-v.paid)}</b><br>${bg(...istat(v))}</div></div>`).join('')}</div></div>`},
customers(){const l=C.map((c,i)=>({...c,i,...bal(i)})).filter(c=>(c.n+c.ph+c.ad).toLowerCase().includes(q));return hd('Customers','Manage farmer accounts and balances',`<button class="btn" onclick="custForm()">${ic('plus')}Add Customer</button>`)+`<div class="card"><div class="tb"><input placeholder="Search name, phone, village…" value="${q}" oninput="q=this.value.toLowerCase();sf()"></div>${tbl(['Customer','Phone','Address','Total Purchases','Paid','Balance','Status'],l.map(c=>tr([`<b>${c.n}</b>`,c.ph,c.ad,F(c.b),F(c.p),`<b>${F(c.b-c.p)}</b>`,c.b-c.p>0?bg('Balance due','a'):bg('Clear','g')],['','','','r','r','r',''],`custDet(${c.i})`)))}</div>`},
products(){const l=P.filter(p=>p.n.toLowerCase().includes(q)&&(cat=='All'||p.c==cat));return hd('Products & Inventory','Track stock, pricing and expiry',`<button class="btn" onclick="prodForm()">${ic('plus')}Add Product</button>`)+`<div class="card"><div class="tb"><input placeholder="Search products…" value="${q}" oninput="q=this.value.toLowerCase();sf()"><select onchange="cat=this.value;draw()">${['All','Seeds','Fertilizers','Pesticides','Herbicides','Fungicides','Tools'].map(c=>`<option ${c==cat?'selected':''}>${c}</option>`).join('')}</select></div>${tbl(['Product','Category','Purchase Price','Sale Price','Stock','Min Stock','Expiry','Status'],l.map(p=>tr([`<b>${p.n}</b>`,p.c,F(p.b),F(p.s),p.st,p.mn,fd(p.ex),bg(...stat(p))],['','','r','r','r','r','',''])))}</div>`},
sales(){return hd('New Sale','Create a sale and generate an invoice')+`<div class="grid g21"><div class="card"><div class="f2"><div><label>Customer</label><select id="sc">${C.map((c,i)=>`<option value="${i}">${c.n} – ${c.ad}</option>`).join('')}</select></div><div><label>Date</label><input value="${fd(TODAY)}" readonly></div></div><h3 style="margin-top:22px">Items</h3>${tbl(['Product','Qty','Price (PKR)','Line Total',''],lines.map((l,i)=>tr([`<select onchange="ln(${i},0,this.value,1)">${P.map((p,j)=>`<option value="${j}" ${j==l[0]?'selected':''}>${p.n}</option>`).join('')}</select>`,`<input type="number" min="1" value="${l[1]}" style="width:70px" oninput="ln(${i},1,this.value)">`,`<input type="number" value="${l[2]}" style="width:110px" oninput="ln(${i},2,this.value)">`,`<b id="lt${i}">${F(l[1]*l[2])}</b>`,`<a style="color:var(--red);cursor:pointer" onclick="lines.splice(${i},1);draw()">✕</a>`],['','','','r','']))) }<button class="btn o s" style="margin-top:12px" onclick="lines.push([0,1,${P[0].s}]);draw()">${ic('plus')}Add Product</button></div>
<div class="card"><h3>Payment</h3><div class="tot"><div><span>Subtotal</span><b id="sb"></b></div></div><label style="margin-top:0">Discount (PKR)</label><input id="ds" type="number" value="0" oninput="calc()"><div class="tot"><div class="gt"><span>Total</span><span id="gt"></span></div></div><label>Payment Method</label><div class="pm">${['Cash','Bank','JazzCash','Easypaisa','Credit'].map(m=>`<span class="${m==pm?'a':''}" onclick="pm='${m}';draw()">${m}</span>`).join('')}</div><label>Paid Amount (PKR)</label><input id="pd" type="number" value="0" oninput="calc()"><div class="tot"><div><span>Remaining</span><b id="rm" style="color:var(--red)"></b></div></div><button class="btn g w" onclick="saveSale()">Save Sale &amp; Generate Invoice</button></div></div>`},
purchases(){return hd('Purchases','Stock purchased from suppliers',`<button class="btn" onclick="purForm()">${ic('plus')}New Purchase</button>`)+`<div class="card">${tbl(['Purchase #','Supplier','Date','Items','Total','Paid','Remaining'],U.map(u=>tr([u.no,S[u.s].n,fd(u.d),u.it.map(x=>P[x[0]].n.split(' ').slice(0,2).join(' ')+' ×'+x[1]).join(', '),F(ptot(u)),F(u.paid),`<b style="color:${ptot(u)>u.paid?'var(--red)':'var(--green)'}">${F(ptot(u)-u.paid)}</b>`],['','','','mut','r','r','r'])))}</div>`},
suppliers(){return hd('Suppliers','Companies and distributors',`<button class="btn" onclick="toast('Supplier form uses the same layout as Add Customer')">${ic('plus')}Add Supplier</button>`)+`<div class="card">${tbl(['Supplier','Phone','City','Purchases','Total Purchased','Paid','Balance'],S.map((s,i)=>{let a=U.filter(u=>u.s==i);return tr([`<b>${s.n}</b>`,s.ph,s.ct,a.length,F(sum(a,ptot)),F(sum(a,u=>u.paid)),F(sum(a,ptot)-sum(a,u=>u.paid))],['','','','r','r','r','r'])}))}</div>`},
invoices(){return hd('Invoices','All sales invoices')+`<div class="card">${tbl(['Invoice #','Customer','Date','Total','Paid','Remaining','Actions'],V.map(v=>tr([`<b>${v.no}</b>`,C[v.c].n,fd(v.d),F(tot(v)),F(v.paid),F(tot(v)-v.paid),`<button class="btn o s" onclick="viewInv('${v.no}')">View</button> <button class="btn o s" onclick="viewInv('${v.no}');setTimeout(print,300)">Print</button>`],['','','','r','r','r','r'])))}</div>`},
installments(){const l=V.filter(v=>v.ins);return hd('Installments','Track recurring customer payments')+`<div class="grid g3" style="margin-bottom:16px">${kp('inst','Outstanding',F(sum(out(),v=>tot(v)-v.paid)),'amb','al')}${kp('inst','Overdue Plans',l.filter(v=>istat(v)[0]=='Overdue').length,'red','rl')}${kp('inst','Pending Plans',l.filter(v=>istat(v)[0]=='Pending').length,'blue','bl')}</div><div class="card">${tbl(['Customer','Invoice','Total','Paid','Remaining','Installment','Due Date','Status',''],l.map(v=>{let s=istat(v);return tr([C[v.c].n,v.no,F(tot(v)),F(v.paid),`<b>${F(tot(v)-v.paid)}</b>`,F(v.ins),fd(v.due),bg(...s),s[0]=='Paid'?'':`<button class="btn g s" onclick="payForm('${v.no}')">Record Payment</button>`],['','','r','r','r','r','','',''])}))}</div>`},
reports(){const R=reps()[rep];return hd('Reports','Business analytics',`<button class="btn o" onclick="print()">${ic('dl')}Export PDF</button>`)+`<div class="tabs">${reps().map((r,i)=>`<span class="${i==rep?'a':''}" onclick="rep=${i};draw()">${r.t}</span>`).join('')}</div><div class="grid g3" style="margin-bottom:16px">${R.k.map(k=>kp('rep',k[0],k[1],'blue','bl')).join('')}</div><div class="card">${tbl(R.h,R.r.map(r=>tr(r,r.map(x=>/^-?PKR/.test(x)?'r':''))))}</div>`},
settings(){return hd('Settings','Shop profile and preferences')+`<div class="card" style="max-width:640px"><div class="f2"><div><label>Shop Name</label><input value="Kisan Agro Center"></div><div><label>Owner</label><input value="Ahmad Khan"></div><div><label>Phone</label><input value="0300-1234567"></div><div><label>NTN</label><input value="1234567-8"></div></div><label>Address</label><input value="Main GT Road, Sahiwal, Punjab"><label>Invoice Footer</label><input value="Thank you for your business. Goods once sold are not returnable."><button class="btn" style="margin-top:18px" onclick="toast('Settings saved')">Save Settings</button></div>`}};
function reps(){const sl=sum(V,tot),pu=sum(U,ptot),ex=[['Shop Rent',45000],['Electricity & Utilities',28500],['Staff Salaries',90000],['Transport',32000]],exs=sum(ex,e=>e[1]);return[
{t:'Sales Report',k:[['Total Sales',F(sl)],['Invoices',V.length],['Collected',F(sum(V,v=>v.paid))]],h:['Invoice','Customer','Date','Total','Paid'],r:V.map(v=>[v.no,C[v.c].n,fd(v.d),F(tot(v)),F(v.paid)])},
{t:'Purchase Report',k:[['Total Purchases',F(pu)],['Orders',U.length],['Paid',F(sum(U,u=>u.paid))]],h:['No','Supplier','Date','Total','Paid'],r:U.map(u=>[u.no,S[u.s].n,fd(u.d),F(ptot(u)),F(u.paid)])},
{t:'Profit / Loss',k:[['Revenue',F(sl)],['Cost of Goods',F(sl*0.84)],['Net Profit',F(sl*0.16-exs)]],h:['Item','Amount'],r:[['Sales Revenue',F(sl)],['Cost of Goods Sold','-'+F(sl*0.84)],['Gross Profit',F(sl*0.16)],...ex.map(e=>[e[0],'-'+F(e[1])]),['Net Profit',F(sl*0.16-exs)]]},
{t:'Stock Report',k:[['Stock Value',F(sum(P,p=>p.st*p.b))],['Items',P.length],['Low Stock',P.filter(p=>p.st<p.mn).length]],h:['Product','Stock','Cost Value','Status'],r:P.map(p=>[p.n,p.st,F(p.st*p.b),stat(p)[0]])},
{t:'Customer Balance',k:[['Receivable',F(sum(V,v=>tot(v)-v.paid))],['Customers',C.length],['With Dues',C.filter((c,i)=>bal(i).b>bal(i).p).length]],h:['Customer','Billed','Paid','Balance'],r:C.map((c,i)=>[c.n,F(bal(i).b),F(bal(i).p),F(bal(i).b-bal(i).p)])},
{t:'Installment Report',k:[['Outstanding',F(sum(out(),v=>tot(v)-v.paid))],['Plans',V.filter(v=>v.ins).length],['Overdue',V.filter(v=>v.ins&&istat(v)[0]=='Overdue').length]],h:['Customer','Invoice','Remaining','Due','Status'],r:V.filter(v=>v.ins).map(v=>[C[v.c].n,v.no,F(tot(v)-v.paid),fd(v.due),istat(v)[0]])},
{t:'Expense Report',k:[['Total Expenses',F(exs)],['Categories',ex.length],['Period','Oct 2026']],h:['Expense','Amount'],r:ex.map(e=>[e[0],F(e[1])])}]}
function ln(i,k,v,r){lines[i][k]=+v;if(r){lines[i][2]=P[+v].s;draw()}else{$('lt'+i).textContent=F(lines[i][1]*lines[i][2]);calc()}}
function calc(){if(!$('sb'))return;const s=sum(lines,l=>l[1]*l[2]),t=Math.max(0,s-(+$('ds').value||0));$('sb').textContent=F(s);$('gt').textContent=F(t);$('rm').textContent=F(Math.max(0,t-(+$('pd').value||0)))}
function saveSale(){if(!lines.length)return toast('Add at least one product');const ci=+$('sc').value,d=+$('ds').value||0,t=sum(lines,l=>l[1]*l[2])-d;let pd=+$('pd').value||0;if(pm!='Credit'&&!pd)pd=t;const n='AGR-2026-0'+(143+V.length-9);const v={no:n,c:ci,d:TODAY,it:lines.map(l=>[...l]),disc:d,paid:Math.min(pd,t),m:pm};if(t>pd){v.ins=Math.ceil((t-pd)/3/500)*500;v.due=addD(TODAY,30)}lines.forEach(l=>P[l[0]].st-=l[1]);V.unshift(v);lines=[[2,10,4600]];pm='Cash';go('invoices');viewInv(n);toast('Sale saved – '+n)}
function viewInv(no){const v=V.find(x=>x.no==no),c=C[v.c];modal(`<div class="inv"><div class="hd"><div class="logo"><b>${ic('prod')}</b><div>Kisan Agro Center<small>Main GT Road, Sahiwal · 0300-1234567 · NTN 1234567-8</small></div></div><div style="text-align:right"><h2>INVOICE</h2><b>${v.no}</b><div class="mut">${fd(v.d)}</div></div></div><div style="display:flex;justify-content:space-between;margin-bottom:16px"><div><div class="mut">Bill To</div><b>${c.n}</b><div>${c.ad}<br>${c.ph}</div></div><div style="text-align:right"><div class="mut">Payment Method</div><b>${v.m}</b><br>${bg(...istat(v))}</div></div>${tbl(['#','Description','Qty','Price','Amount'],v.it.map((x,i)=>tr([i+1,P[x[0]].n,x[1],F(x[2]),F(x[1]*x[2])],['','','r','r','r'])))}<div class="tot" style="width:280px;margin-left:auto;margin-top:12px"><div><span>Discount</span><span>${F(v.disc)}</span></div><div class="gt"><span>Total</span><span>${F(tot(v))}</span></div><div><span>Paid</span><span>${F(v.paid)}</span></div><div><b>Remaining</b><b style="color:var(--red)">${F(tot(v)-v.paid)}</b></div></div><p class="mut" style="font-size:12px;border-top:1px solid var(--line);padding-top:12px">Thank you for your business. Goods once sold are not returnable.</p></div><div class="nop" style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" onclick="close()">Close</button><button class="btn o" onclick="print()">${ic('dl')}Download</button><button class="btn" onclick="print()">${ic('pr')}Print</button></div>`,1)}
function custDet(i){const c=C[i],b=bal(i);modal(`<h2 style="margin:0">${c.n}</h2><div class="mut">${c.ph} · ${c.ad}</div><div class="grid g3" style="margin:16px 0">${kp('sales','Billed',F(b.b),'blue','bl')}${kp('sales','Paid',F(b.p),'green','gl')}${kp('inst','Balance',F(b.b-b.p),'amb','al')}</div><h3>Purchase History</h3>${tbl(['Invoice','Date','Total','Paid'],V.filter(v=>v.c==i).map(v=>tr([v.no,fd(v.d),F(tot(v)),F(v.paid)],['','','r','r'])))}<div style="text-align:right;margin-top:14px"><button class="btn o" onclick="close()">Close</button></div>`,1)}
function custForm(){modal(`<h2 style="margin:0">Add Customer</h2><label>Full Name</label><input id="cn"><div class="f2"><div><label>Phone</label><input id="cp" placeholder="03xx-xxxxxxx"></div><div><label>Village / City</label><input id="ca"></div></div><div style="text-align:right;margin-top:20px"><button class="btn o" onclick="close()">Cancel</button> <button class="btn" onclick="C.push({n:$('cn').value||'New Customer',ph:$('cp').value,ad:$('ca').value});close();draw();toast('Customer added')">Save</button></div>`)}
function prodForm(){modal(`<h2 style="margin:0">Add Product</h2><label>Product Name</label><input id="pn"><div class="f2"><div><label>Category</label><select id="pc">${['Seeds','Fertilizers','Pesticides','Herbicides','Fungicides','Tools'].map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Expiry Date</label><input id="pe" type="date"></div><div><label>Purchase Price</label><input id="pb" type="number"></div><div><label>Sale Price</label><input id="ps" type="number"></div><div><label>Stock</label><input id="pt" type="number"></div><div><label>Minimum Stock</label><input id="pm2" type="number"></div></div><div style="text-align:right;margin-top:20px"><button class="btn o" onclick="close()">Cancel</button> <button class="btn" onclick="P.push({n:$('pn').value||'New Product',c:$('pc').value,b:+$('pb').value,s:+$('ps').value,st:+$('pt').value,mn:+$('pm2').value,ex:$('pe').value});close();draw();toast('Product added')">Save</button></div>`)}
function purForm(){modal(`<h2 style="margin:0">New Purchase</h2><label>Supplier</label><select id="us">${S.map((s,i)=>`<option value="${i}">${s.n}</option>`).join('')}</select><div class="f2"><div><label>Product</label><select id="up">${P.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('')}</select></div><div><label>Quantity</label><input id="uq" type="number" value="10"></div><div><label>Purchase Price</label><input id="ur" type="number" value="4350"></div><div><label>Paid</label><input id="ud" type="number" value="0"></div></div><div style="text-align:right;margin-top:20px"><button class="btn o" onclick="close()">Cancel</button> <button class="btn" onclick="U.unshift({no:'PUR-0'+(88+U.length-5),s:+$('us').value,d:TODAY,it:[[+$('up').value,+$('uq').value,+$('ur').value]],paid:+$('ud').value});P[+$('up').value].st+=+$('uq').value;close();draw();toast('Purchase saved')">Save Purchase</button></div>`)}
function payForm(no){const v=V.find(x=>x.no==no);modal(`<h2 style="margin:0">Record Payment</h2><div class="mut">${C[v.c].n} · ${v.no} · Remaining ${F(tot(v)-v.paid)}</div><label>Amount Received (PKR)</label><input id="pa" type="number" value="${Math.min(v.ins,tot(v)-v.paid)}"><label>Method</label><select><option>Cash</option><option>Bank</option><option>JazzCash</option><option>Easypaisa</option></select><div style="text-align:right;margin-top:20px"><button class="btn o" onclick="close()">Cancel</button> <button class="btn g" onclick="payOk('${no}')">Save Payment</button></div>`)}
function payOk(no){const v=V.find(x=>x.no==no);v.paid+=+$('pa').value||0;v.due=addD(v.due>TODAY?v.due:TODAY,30);close();draw();toast('Payment recorded')}
</script></body></html>
